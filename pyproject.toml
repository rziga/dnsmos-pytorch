[project]
name = "dnsmos-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ziga R.", email = "ziga.mlearning@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.3.5",
    "safetensors>=0.8.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy<=2.3",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.23.2; sys_platform != 'darwin'",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
    "scipy>=1.17.0",
    "torchmetrics>=1.8.2",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
